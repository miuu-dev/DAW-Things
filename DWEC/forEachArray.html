<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Método foreach de los arrays</title>
    <link rel="icon" href="../../img/miuuLogo.png">
</head>
<body>
    <script>
        let nums = [23,1,34,352,6,6,,,,,,62,]

        document.write("<h2>LOS ELEMENTOS DEL CONJUNTO SON </h2>")
        nums.forEach((valor,clave)=>{document.write(`La celda ${clave} es ${valor}<br>`)})

        let conjunto = new Set([...nums])
        console.log(conjunto);

        document.write("<h2>LOS ELEMENTOS DEL ARRAY SON </h2>")
        conjunto.forEach((valor)=> { document.write(valor + "<br>")})

        let mapa = new Map([["tomate", "Fruta roja que viene de América"],["zanahoria", "Raíz naranja"]])


        document.write("<h2>LOS ELEMENTOS DEL MAPA SON </h2>")
        mapa.forEach((valor, clave) => {
            document.write(`<strong>Palabra:</strong> ${clave} -> <strong>Significado:</strong> ${valor} <br>`)
        })
        
    </script>
</body>
</html>
