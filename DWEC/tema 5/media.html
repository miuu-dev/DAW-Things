<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calcular media</title>
    <link rel="icon" href="../../img/miuuLogo.png">
    <style>
        @font-face {
            font-family: 'CenturyGothic';
            src: url('../../fonts/CenturyGothic.otf');
        }

        * {
            font-family: 'CenturyGothic', sans-serif;
        }
    </style>
</head>
<body>
    <script>
        function media(...nums) {
            let acu = 0
            for (let n of nums) {
                acu += n 
            }

            return (acu / nums.length)
        }

        alert("La media es " + media(8,5,6,73));
        
    </script>
</body>
</html>
