<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Función Flecha Par o Impar</title>
    <link rel="icon" href="../../img/miuuLogo.png">
    <style>
        @font-face {
            font-family: 'CenturyGothic';
            src: url('../../fonts/CenturyGothic.otf');
        }

        * {
            font-family: 'CenturyGothic', sans-serif;
        }
    </style>
</head>
<body>
    <script>
        const parimpar = (num) => (num%2==0)?`${num} es par`:`${num} es impar`

        let n = parseInt(prompt("Introduce un número entero: "))
        alert( (parimpar(n)) )
    </script>
</body>
</html>
